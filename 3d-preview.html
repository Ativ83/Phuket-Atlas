<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Phuket Atlas · экспериментальная 3D-карта</title><link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#082b40;color:#f4e4c7;font-family:-apple-system,system-ui,sans-serif}#map{position:absolute;inset:0}.toolbar{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}.toolbar a,.toolbar button{border:1px solid #e3c28e;border-radius:13px;background:#0a3149e8;color:#f2d09a;font-size:13px;font-weight:750;padding:11px 14px;text-decoration:none;backdrop-filter:blur(8px)}.bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;z-index:5;text-align:center;pointer-events:none}.bottom span{display:inline-block;padding:11px 20px;border:1px solid #d6b6837d;background:#082d40d9;border-radius:14px;backdrop-filter:blur(10px);font-weight:750;letter-spacing:.1em}.status{position:fixed;left:12px;right:12px;top:33%;z-index:6;text-align:center;padding:20px;background:#062f42eb;border:1px solid #d0ab74;border-radius:18px;max-width:460px;margin:auto}.status[hidden]{display:none}.status button{background:#e6c793;color:#0b3244;border:0;border-radius:10px;padding:12px 18px}.mapboxgl-ctrl-bottom-right{bottom:64px!important}.pin{background:#e5b569;border:3px solid #fff2d5;border-radius:50%;height:18px;width:18px;box-shadow:0 0 0 5px #142f3b66}
</style></head><body><div id="map"></div><div class="toolbar"><a href="./">← Phuket Atlas</a><button id="overview">Весь Пхукет</button><button id="angle">Угол обзора</button></div><div id="status" class="status" hidden></div><div class="bottom"><span>ТАИЛАНД · ПХУКЕТ · 3D DEMO</span></div><script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script><script>
(()=>{"use strict";
const status=document.getElementById("status");function warn(message){status.hidden=false;status.textContent=message}
const token=localStorage.getItem("phuket_mapbox_public_token");if(!token){warn("Сначала подключите Mapbox Satellite на главной карте. Токен хранится в том же браузере iPhone.");return;}
if(!mapboxgl.supported()){warn("Этому устройству или браузеру недоступен WebGL2, необходимый для 3D.");return;}
mapboxgl.accessToken=token;
const map=new mapboxgl.Map({container:"map",style:"mapbox://styles/mapbox/standard-satellite",center:[98.34,7.96],zoom:10,pitch:57,bearing:-14,antialias:true,attributionControl:true});
map.on("style.load",()=>{try{if(!map.getSource("phuket-elevation"))map.addSource("phuket-elevation",{type:"raster-dem",url:"mapbox://mapbox.mapbox-terrain-dem-v1",tileSize:512,maxzoom:14});map.setTerrain({source:"phuket-elevation",exaggeration:1.7});}catch(e){warn("Не удалось активировать объёмный рельеф: "+e.message)}});
map.on("error",e=>{if(/401|403|Unauthorized/i.test(String(e.error?.message)))warn("Mapbox отклонил токен или доступ к 3D-слоям. Проверьте настройки Mapbox.")});
map.on("load",()=>{fetch("data/locations.json").then(r=>r.json()).then(areas=>{for(const a of areas){for(const o of a.objects||[]){if(!Number.isFinite(o.lon)||!Number.isFinite(o.lat))continue;const el=document.createElement("div");el.className="pin";el.title=o.name;new mapboxgl.Marker({element:el}).setLngLat([o.lon,o.lat]).setPopup(new mapboxgl.Popup().setText(o.name)).addTo(map)}}}).catch(()=>{})});
document.getElementById("overview").onclick=()=>map.flyTo({center:[98.34,7.96],zoom:10,pitch:57,bearing:-14,duration:1300});
let high=true;document.getElementById("angle").onclick=()=>{high=!high;map.easeTo({pitch:high?57:15,bearing:high?-14:0,duration:1100})};
})();
</script></body></html>
