name: Preview Patong Silero voice (free)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patong-silero-preview.yml'
      - 'scripts/generate_patong_silero_preview.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Silero dependencies and FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2,<3" "omegaconf>=2.3,<3" "numpy>=1.26,<3"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Generate Silero Patong audio sample
        run: python scripts/generate_patong_silero_preview.py
      - name: Publish only Silero preview MP3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/district-audio/patong-silero-test.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Publish isolated Silero Patong voice sample"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
