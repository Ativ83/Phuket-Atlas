name: Generate corrected Phuket district audio
on:
  push:
    paths:
      - '.github/workflows/district-audio.yml'
      - 'scripts/generate_district_audio.py'
      - 'data/district-narrations-ru.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: phuket-district-audio
  cancel-in-progress: false
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Edge TTS
        run: python -m pip install "edge-tts>=7,<9" imageio-ffmpeg
      - name: Regenerate only Patong narration
        run: |
          mkdir -p assets/district-audio
          python -u scripts/generate_district_audio.py --force patong
          test -s assets/district-audio/patong.mp3
          echo "Patong MP3 size: $(wc -c < assets/district-audio/patong.mp3) bytes"
      - name: Commit successful MP3 recordings
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/district-audio/patong.mp3
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Regenerate Patong MP3 with plain Cyrillic pronunciation"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Republish website after saving generated recordings
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
