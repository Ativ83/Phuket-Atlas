name: Generate missing Phuket district audio
on:
  push:
    paths:
      - '.github/workflows/district-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: phuket-district-audio
  cancel-in-progress: false
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Edge TTS
        run: python -m pip install "edge-tts>=7,<9" imageio-ffmpeg
      - name: Generate or improve missing narration files
        run: |
          mkdir -p assets/district-audio
          python -u scripts/generate_district_audio.py
      - name: Commit successful MP3 recordings
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/district-audio/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh generated district narration MP3 files"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
