name: Publish Phuket Atlas
# Publish after Sergey ElevenLabs audio import; ensures latest MP3 is deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate catalogue
        run: |
          python3 -m json.tool data/locations.json > /dev/null
          test -f index.html
          test -f app.js
          node --check app.js
          node --check broker-ai.js
          node --check ai-worker/src/index.js
      - name: Ensure Bang Tao has playable fallback audio
        run: |
          mkdir -p assets/district-audio
          if [ ! -s assets/district-audio/bang-tao.mp3 ]; then
            cp assets/bang-tao-narration-ru-v3.mp3 assets/district-audio/bang-tao.mp3
          fi
          test -s assets/district-audio/bang-tao.mp3
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
