name: Import project cover images from Drive
on:
  push:
    paths:
      - '.github/workflows/project-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and image tools
        run: python -m pip install --quiet gdown Pillow PyMuPDF
      - name: Extract project exterior images from developer brochures
        run: python -u scripts/build_project_covers.py
      - name: Save generated covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-covers/
          if ! git diff --cached --quiet; then
            git commit -m "Publish real Bang Tao development exterior covers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
